name = "focusguard-backend"
main = "src/index.ts"
compatibility_date = "2023-12-01"
compatibility_flags = [ "nodejs_compat" ]

# KV Binding for Session/JWT Validation
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "YOUR_KV_NAMESPACE_ID"

[[d1_databases]]
binding = "DB"
database_name = "focusguard_db"
database_id = "YOUR_D1_DATABASE_ID"

# [vars]
# CLOUDFLARE_API_TOKEN = "configured via wrangler secret put"
# CLOUDFLARE_ACCOUNT_ID = "configured via wrangler secret put"
# STRIPE_WEBHOOK_SECRET = "configured via wrangler secret put"
# JWT_SECRET = "configured via wrangler secret put"

[build]
command = "npm run build"
watch_dir = "src"

